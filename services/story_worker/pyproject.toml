[project]
name = "story2audio-story-worker"
version = "2.0.0"
description = "Celery worker for the LLM stage. Streams tokens, persists the story."
requires-python = ">=3.11,<3.12"
dependencies = [
    "story2audio-shared",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_worker"]
