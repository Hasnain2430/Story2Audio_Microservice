[project]
name = "story2audio-gateway"
version = "2.0.0"
description = "Public REST + WebSocket API. Accepts jobs, returns ids, never blocks."
requires-python = ">=3.11,<3.12"
dependencies = [
    "story2audio-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    # The API itself is async, but Alembic is not: migrations are a one-shot deploy
    # step and run through the sync driver (see alembic/env.py). The gateway owns
    # every migration (ADR-0001), so it needs both drivers.
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "soundfile>=0.12",
    "prometheus-client>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
