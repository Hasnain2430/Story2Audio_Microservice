[project]
name = "story2audio-tts-worker"
version = "2.0.0"
description = "Celery worker for the TTS stage. Segments, synthesizes, stitches, uploads."
requires-python = ">=3.11,<3.12"
dependencies = [
    "story2audio-shared",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "grpcio>=1.68",
    "protobuf>=5.28",
    "soundfile>=0.12",
    "numpy>=2.0",
    # MP3 encoding without ffmpeg. v1 pulled ffmpeg in for pydub's export; the
    # trim/fade/join work it also used pydub for is array arithmetic we do in numpy.
    "lameenc>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_worker"]
