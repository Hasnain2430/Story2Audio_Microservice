[project]
name = "story2audio-tts-worker"
version = "2.0.0"
description = "Celery worker for the TTS stage. Segments, synthesizes, stitches, uploads."
requires-python = ">=3.11,<3.12"
dependencies = [
    "story2audio-shared",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "grpcio>=1.68",
    "protobuf>=5.28",
    "pydub>=0.25",
    "soundfile>=0.12",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_worker"]
