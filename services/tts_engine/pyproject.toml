# A workspace member whose heavy dependencies are not: torch and coqui-tts live behind
# the `gpu` extra, so the shared lock resolves without them and only the GPU image
# installs them. This service shares no Python with the others -- only the gRPC contract
# in proto/tts/v1 -- which is why it keeps its own logging helper rather than importing
# packages/shared.
[project]
name = "story2audio-tts-engine"
version = "2.0.0"
description = "gRPC TTS server. Holds XTTS v2 in VRAM, streams PCM chunks."
requires-python = ">=3.11,<3.12"
dependencies = [
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "protobuf>=5.28",
    "numpy>=1.26",
    "soundfile>=0.12",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Installed only in the GPU image; kept out of the default resolve so CI stays fast.
gpu = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "coqui-tts>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_engine"]
