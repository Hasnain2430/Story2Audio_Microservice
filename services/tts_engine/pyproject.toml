# Standalone: NOT part of the root uv workspace. See the comment in the root pyproject.toml.
# Resolved and locked on its own because torch + Coqui TTS pins do not co-resolve cleanly
# with the light services. It shares no Python code with them -- only the gRPC contract.
[project]
name = "story2audio-tts-engine"
version = "2.0.0"
description = "gRPC TTS server. Holds XTTS v2 in VRAM, streams PCM chunks."
requires-python = ">=3.11,<3.12"
dependencies = [
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "protobuf>=5.28",
    "numpy>=1.26",
    "soundfile>=0.12",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Installed only in the GPU image; kept out of the default resolve so CI stays fast.
gpu = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "coqui-tts>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_engine"]

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.18", "pytest>=8.3", "grpcio-tools>=1.68"]
