[project]
name = "story2audio"
version = "2.0.0"
description = "Async story-to-audio generation pipeline"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

# `services/tts_engine` is a member, but its heavy dependencies are not: torch and
# coqui-tts sit behind its `gpu` extra, so the shared lock resolves without them and CI
# stays fast. Phase 0 kept the engine out of the workspace entirely, on the assumption
# that those pins would poison a joint resolution; once they moved behind an extra that
# reasoning stopped applying, and membership is what lets the engine be tested from the
# same suite as everything else. It still shares no Python with the other services —
# only the gRPC contract in `proto/tts/v1`.
[tool.uv.workspace]
members = [
    "packages/shared",
    "services/gateway",
    "services/story_worker",
    "services/tts_worker",
    "services/tts_engine",
]

[tool.uv.sources]
story2audio-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-boto3[s3]>=1.35",
    "pre-commit>=4.0",
    "aiosqlite>=0.20",
    "fakeredis[lua]>=2.26",
    "httpx>=0.28",
    "httpx-ws>=0.7",
    "pytest-timeout>=2.3",
    "grpcio-tools>=1.68",
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "types-grpcio>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "**/*_pb2.py", "**/*_pb2_grpc.py", "**/*_pb2.pyi"]

[tool.ruff.format]
# Markdown is prose. Ruff would otherwise reformat Python snippets inside fenced
# blocks in docs/, which breaks deliberate illustrative formatting.
exclude = ["*.md"]

[tool.ruff.lint]
# Two deliberate sources of "confusable" characters:
#   - docs and docstrings quote v1 literals verbatim, including the en-dash in the
#     `[PARA_LEVEL:1-3]` sentinel, whose exact character is part of the bug described;
#   - this is a multilingual app, so full-width and non-Latin sentence punctuation is
#     real domain data, not a typo (see prompts._TERMINAL_PUNCTUATION).
allowed-confusables = ["–", "—", "！", "？", "’", "”", "»", "؟"]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit security
    "BLE",      # blind except  -- v1 defect 19
    "T20",      # no print()    -- v1 used print() as its only logging
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.isort]
# Workspace packages are first-party even though they install like any other dependency;
# without this they sort in with third-party imports.
known-first-party = ["story2audio_shared", "gateway", "story_worker", "tts_worker", "tts_engine"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["^legacy/", "_pb2\\.py$", "_pb2_grpc\\.py$"]

[[tool.mypy.overrides]]
# torch and coqui-tts are installed only in the GPU image, behind an optional extra.
module = ["pydub.*", "celery.*", "soundfile.*", "TTS.*", "torch.*", "grpc_health.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# protoc emits untyped stubs. They are generated, not written, so errors inside them
# are not ours to fix -- the contract they encode is checked at the call sites.
module = ["tts_engine.pb.*", "tts_worker.pb.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Modules that consume those untyped stubs: the generated servicer base class and
# registration helpers carry no annotations. Scoped so the relaxation cannot spread.
module = [
    "tts_engine.server",
    "tts_worker.engine_client",
    "tests.unit.test_tts_engine",
]
disallow_untyped_calls = false
disallow_subclassing_any = false
# The stub backends in the engine tests raise before their `yield`, which mypy reads
# as unreachable -- the yield is what keeps them generators.
warn_unreachable = false

[[tool.mypy.overrides]]
# Celery's `@app.task` decorator is untyped, which under --strict makes every task
# function untyped too. Scoped to the task modules so the relaxation cannot spread.
module = ["story_worker.tasks", "tts_worker.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires the docker compose stack to be running",
    "e2e: full browser end-to-end",
]
